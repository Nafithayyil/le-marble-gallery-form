    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.69  0 0 0 0 0.6  0 0 0 0 0.48  0 0 1 0 -0.45"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#cloud)" opacity=".22"/>
